spring:
  application:
    name: rag-service
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_db
    username: rag_user
    password: rag_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: rag_password
      timeout: 3s
      repositories:
        enabled: false
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: ./logs
    name: rag-service.log
  level:
    root: INFO
    "[com.example.rag]": INFO

rag:
  id:
    worker-id: 1
    datacenter-id: 1
  storage:
    base-dir: ./data/uploads
    max-file-size-mb: 20
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    await-termination-seconds: 30
    thread-name-prefix: rag-indexing-
  chunking:
    strategy: fixed-window
    max-chunk-chars: 600
    overlap-chars: 80
    min-break-search-offset: 240
  embedding:
    provider: rag-ai-service
    model: text-embedding-v4
    vector-dimensions: 1024
    distance-metric: cosine
    batch-size: 10
  ai:
    gateway:
      base-url: http://localhost:8001
      embeddings-path: /v1/embeddings
      chat-completions-path: /v1/chat/completions
      agent-runs-path: /v1/agent/runs
      agent-runs-stream-path: /v1/agent/runs/stream
      connect-timeout-millis: 5000
      read-timeout-millis: 120000
      agent-stream-read-timeout-millis: 120000
  agent:
    internal-tool-token: ${RAG_AGENT_TOOL_TOKEN:dev-agent-tool-token}
    mcp-allowed-origins:
      - ${RAG_MCP_ALLOWED_ORIGIN:http://127.0.0.1:8001}
      - http://localhost:8001
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      await-termination-seconds: 30
      thread-name-prefix: rag-agent-
    recovery:
      enabled: true
      scan-interval-seconds: 60
      running-timeout-minutes: 10
      idle-timeout-minutes: 3
      heartbeat-update-interval-seconds: 30
  llm:
    chat:
      model: deepseek-v4-pro
      temperature: 0.2
      max-output-tokens: 1200
  retrieval:
    vector-store: pgvector
    default-mode: DENSE
    default-top-k: 5
    max-top-k: 10
    dense-candidate-limit: 8
    keyword-candidate-limit: 8
    fusion-k: 60
    keyword-strategy: LIKE
    keyword-ts-config: simple
    keyword-rank-function: ts_rank_cd
    keyword-min-token-length: 3
    keyword-like-phrase-weight: 3.0
    keyword-like-title-weight: 1.5
    keyword-min-hit-threshold: 0.5
    max-context-chars: 6000
  qa:
    default-created-by: qa-service
    message-type: QA
    prompt-template: qa-default-v1
    session-name-max-length: 80
  indexing:
    max-retry-count: 3
    recovery:
      enabled: true
      stale-after-seconds: 600
      scan-limit: 20
  cache:
    knowledge-base-detail-ttl-seconds: 3600
    knowledge-base-page-ttl-seconds: 3600
    document-detail-ttl-seconds: 3600
    document-page-ttl-seconds: 1800
    document-chunks-ttl-seconds: 1800
    qa-readiness-ttl-seconds: 600
    qa-retrieval-ttl-seconds: 600
