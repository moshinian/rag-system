spring:
  application:
    name: rag-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_db}
    username: ${DB_USERNAME:rag_user}
    password: ${DB_PASSWORD:rag_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rag_password}
      timeout: 3s
      repositories:
        enabled: false
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,snowflakeWorkerLease
        readiness:
          include: readinessState,snowflakeWorkerLease
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: ${LOG_PATH:./logs}
    name: ${LOG_FILE_NAME:rag-service.log}
  level:
    root: INFO
    "[com.example.rag]": INFO

rag:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  id:
    worker-id: ${RAG_ID_WORKER_ID:1}
    datacenter-id: ${RAG_ID_DATACENTER_ID:1}
    worker-lease:
      mode: ${RAG_ID_WORKER_LEASE_MODE:static}
      key-prefix: ${RAG_ID_WORKER_LEASE_KEY_PREFIX:rag:snowflake:worker}
      lease-duration: ${RAG_ID_WORKER_LEASE_DURATION:120s}
      renewal-interval: ${RAG_ID_WORKER_RENEWAL_INTERVAL:30s}
      max-worker-id: ${RAG_ID_MAX_WORKER_ID:31}
  storage:
    type: ${RAG_STORAGE_TYPE:local}
    base-dir: ${RAG_STORAGE_BASE_DIR:./data/uploads}
    max-file-size-mb: 20
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${MINIO_BUCKET:rag-files}
      access-key: ${MINIO_ACCESS_KEY:rag_minio}
      secret-key: ${MINIO_SECRET_KEY:rag_minio_password}
  executor:
    core-pool-size: ${RAG_INDEXING_CORE_POOL_SIZE:1}
    max-pool-size: ${RAG_INDEXING_MAX_POOL_SIZE:1}
    queue-capacity: ${RAG_INDEXING_QUEUE_CAPACITY:20}
    await-termination-seconds: 30
    thread-name-prefix: rag-indexing-
  chunking:
    strategy: fixed-window
    max-chunk-chars: 600
    overlap-chars: 80
    min-break-search-offset: 240
  embedding:
    provider: rag-ai-service
    model: text-embedding-v4
    vector-dimensions: 1024
    distance-metric: cosine
    batch-size: 10
  ai:
    gateway:
      base-url: ${RAG_AI_GATEWAY_BASE_URL:http://localhost:8001}
      embeddings-path: /v1/embeddings
      chat-completions-path: /v1/chat/completions
      rerank-path: /v1/rerank
      agent-runs-path: /v1/agent/runs
      agent-runs-stream-path: /v1/agent/runs/stream
      connect-timeout-millis: 5000
      read-timeout-millis: 120000
      rerank-read-timeout-millis: 10000
      agent-stream-read-timeout-millis: 120000
  agent:
    internal-tool-token: ${RAG_AGENT_TOOL_TOKEN:dev-agent-tool-token}
    mcp-allowed-origins:
      - ${RAG_MCP_ALLOWED_ORIGIN:http://127.0.0.1:8001}
      - http://localhost:8001
    executor:
      core-pool-size: ${RAG_AGENT_CORE_POOL_SIZE:1}
      max-pool-size: ${RAG_AGENT_MAX_POOL_SIZE:1}
      queue-capacity: ${RAG_AGENT_QUEUE_CAPACITY:20}
      await-termination-seconds: 30
      thread-name-prefix: rag-agent-
    worker:
      enabled: ${RAG_AGENT_WORKER_ENABLED:true}
      poll-interval: ${RAG_AGENT_POLL_INTERVAL:1s}
      lease-duration: ${RAG_AGENT_LEASE_DURATION:120s}
      heartbeat-interval: ${RAG_AGENT_HEARTBEAT_INTERVAL:30s}
      max-attempts: ${RAG_AGENT_MAX_ATTEMPTS:3}
    recovery:
      enabled: ${RAG_AGENT_RECOVERY_ENABLED:true}
      scan-interval-seconds: ${RAG_AGENT_RECOVERY_SCAN_INTERVAL_SECONDS:60}
      running-timeout-minutes: ${RAG_AGENT_RUNNING_TIMEOUT_MINUTES:10}
      idle-timeout-minutes: ${RAG_AGENT_IDLE_TIMEOUT_MINUTES:3}
      heartbeat-update-interval-seconds: ${RAG_AGENT_HEARTBEAT_INTERVAL_SECONDS:30}
  llm:
    chat:
      model: deepseek-v4-pro
      temperature: 0.2
      max-output-tokens: 1200
  retrieval:
    vector-store: pgvector
    default-mode: DENSE
    default-top-k: 5
    max-top-k: 10
    dense-candidate-limit: 8
    keyword-candidate-limit: 8
    fusion-k: 60
    keyword-strategy: LIKE
    keyword-ts-config: simple
    keyword-rank-function: ts_rank_cd
    keyword-min-token-length: 3
    keyword-like-phrase-weight: 3.0
    keyword-like-title-weight: 1.5
    keyword-min-hit-threshold: 0.5
    max-context-chars: 6000
    rerank:
      enabled: ${RAG_RERANK_ENABLED:false}
      model: ${RAG_RERANK_MODEL:qwen3-rerank}
      candidate-limit: ${RAG_RERANK_CANDIDATE_LIMIT:20}
      instruct: ${RAG_RERANK_INSTRUCT:}
      policy-version: rerank-v1
  qa:
    default-created-by: qa-service
    message-type: QA
    prompt-template: qa-default-v1
    session-name-max-length: 80
  indexing:
    max-retry-count: 3
    worker:
      enabled: ${RAG_INDEXING_WORKER_ENABLED:true}
      poll-interval: ${RAG_INDEXING_POLL_INTERVAL:1s}
      lease-duration: ${RAG_INDEXING_LEASE_DURATION:120s}
      heartbeat-interval: ${RAG_INDEXING_HEARTBEAT_INTERVAL:30s}
    recovery:
      enabled: ${RAG_INDEXING_RECOVERY_ENABLED:true}
      scan-interval: ${RAG_INDEXING_RECOVERY_SCAN_INTERVAL:10s}
      stale-after-seconds: ${RAG_INDEXING_STALE_AFTER_SECONDS:600}
      scan-limit: ${RAG_INDEXING_RECOVERY_SCAN_LIMIT:20}
  cache:
    knowledge-base-detail-ttl-seconds: 3600
    knowledge-base-page-ttl-seconds: 3600
    document-detail-ttl-seconds: 3600
    document-page-ttl-seconds: 1800
    document-chunks-ttl-seconds: 1800
    qa-readiness-ttl-seconds: 600
    qa-retrieval-ttl-seconds: 600

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:35s}
