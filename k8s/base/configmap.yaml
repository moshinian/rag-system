apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-system
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  DB_URL: jdbc:postgresql://postgres:5432/rag_db
  DB_USERNAME: rag_user
  DB_POOL_MAX_SIZE: "5"
  DB_POOL_MIN_IDLE: "1"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RAG_ID_WORKER_LEASE_MODE: redis-lease
  RAG_ID_WORKER_LEASE_DURATION: 120s
  RAG_ID_WORKER_RENEWAL_INTERVAL: 30s
  RAG_ID_MAX_WORKER_ID: "31"
  RAG_AI_GATEWAY_BASE_URL: http://rag-ai-service:8001
  RAG_STORAGE_BASE_DIR: /app/data/uploads
  RAG_STORAGE_TYPE: minio
  RAG_INDEXING_CORE_POOL_SIZE: "1"
  RAG_INDEXING_MAX_POOL_SIZE: "1"
  RAG_INDEXING_QUEUE_CAPACITY: "20"
  RAG_INDEXING_POLL_INTERVAL: 1s
  RAG_INDEXING_LEASE_DURATION: 120s
  RAG_INDEXING_HEARTBEAT_INTERVAL: 30s
  RAG_INDEXING_RECOVERY_SCAN_INTERVAL: 10s
  RAG_AGENT_CORE_POOL_SIZE: "1"
  RAG_AGENT_MAX_POOL_SIZE: "1"
  RAG_AGENT_QUEUE_CAPACITY: "20"
  RAG_AGENT_POLL_INTERVAL: 1s
  RAG_AGENT_LEASE_DURATION: 120s
  RAG_AGENT_HEARTBEAT_INTERVAL: 30s
  RAG_AGENT_MAX_ATTEMPTS: "3"
  RAG_AGENT_HEARTBEAT_INTERVAL_SECONDS: "30"
  RAG_AGENT_RECOVERY_SCAN_INTERVAL_SECONDS: "30"
  SHUTDOWN_PHASE_TIMEOUT: 35s
  LOG_PATH: /tmp/rag-logs
  MCP_TOOL_BASE_URL: http://rag-backend:8080
  MCP_TOOL_ORIGIN: http://rag-ai-service:8001
  RAG_MCP_ALLOWED_ORIGIN: http://rag-ai-service:8001
  EMBEDDING_PROVIDER: aliyun-bailian-openai-compatible
  EMBEDDING_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  EMBEDDING_DEFAULT_MODEL: text-embedding-v4
  CHAT_PROVIDER: deepseek-openai-compatible
  CHAT_BASE_URL: https://api.deepseek.com
  CHAT_DEFAULT_MODEL: deepseek-v4-pro
  RERANK_PROVIDER: aliyun-bailian
  RERANK_BASE_URL: https://dashscope.aliyuncs.com/api/v1
  RERANK_DEFAULT_MODEL: qwen3-rerank
  RERANK_PATH: /services/rerank/text-rerank/text-rerank
  RERANK_REQUEST_FORMAT: dashscope-input
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: rag-files
