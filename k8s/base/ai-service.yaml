apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ai-service
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ai-service
  template:
    metadata:
      labels:
        app: rag-ai-service
    spec:
      containers:
        - name: rag-ai-service
          image: rag-ai-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          env:
            # Java 与 Python 必须使用同一个 MCP Token；Secret 中只维护一份权威值。
            - name: MCP_TOOL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: RAG_AGENT_TOOL_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ai-service
  namespace: rag-system
spec:
  selector:
    app: rag-ai-service
  ports:
    - name: http
      port: 8001
      targetPort: http
