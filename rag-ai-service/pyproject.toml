[project]
name = "rag-ai-service"
version = "0.1.0"
description = "Minimal AI gateway for the RAG system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "langchain>=1.1.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0,<1.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langgraph>=1.2.0,<1.3.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change in a future version.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning:langgraph.cache.base",
]

[tool.pyright]
venvPath = ".."
venv = ".venv"
stubPath = "typings"
include = ["app", "tests"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "**/.pytest_cache",
    "**/rag_ai_service.egg-info",
]
