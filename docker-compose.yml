services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: always
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - ./rag-backend/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag-redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass rag_password
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ./rag-backend/data/redis:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: rag-redisinsight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - ./rag-backend/data/redisinsight:/data
